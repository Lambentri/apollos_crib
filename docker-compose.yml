version: "2"
services:
  postgres:
    restart: always
    image: postgis/postgis:15-master
    ports:
      - "54321:5432"
    # Two repos, a pool each, and both are opened as soon as the app starts --
    # so the default ceiling of 100 is already most of the way spent before
    # anything queries anything. Matching prod's 300 rather than picking a dev
    # number, because the point of dev matching prod here is that a pool
    # problem shows up in both places or neither.
    command: postgres -c max_connections=300
    volumes:
      - pgdata:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=room_sanctum_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology
  rabbitmq:
    restart: always
    image: rabbitmq:3.12-management-alpine
    ports:
      # The standard AMQP protocol port
      - '5672:5672'
      # HTTP management UI
      - '15672:15672'
      # MQTT
      # - '18833:1883'
    environment:
      - RABBITMQ_DEFAULT_USER=hermes
      - RABBITMQ_DEFAULT_PASS=hermes
    volumes:
      - ./rabbit/rabbit.conf:/etc/rabbitmq/rabbitmq.conf:Z
      - ./rabbit/enabled_plugins:/etc/rabbitmq/enabled_plugins:Z
volumes:
  pgdata: {}
